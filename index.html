<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TimeTracker</title>
  <link rel="stylesheet" href="styles.css">
  <script src="msal-browser.min.js"></script>
</head>
<body>
  <!-- Login Screen -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#FA5D00" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
      </svg>
      <h1>TimeTracker</h1>
      <p>Track your work hours like a pro.</p>
      <button id="loginBtn" class="login-btn" onclick="signIn()">
        <svg width="20" height="20" viewBox="0 0 23 23" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="11" height="11" fill="#f25022"/>
          <rect x="12" width="11" height="11" fill="#7fba00"/>
          <rect y="12" width="11" height="11" fill="#00a4ef"/>
          <rect x="12" y="12" width="11" height="11" fill="#ffb900"/>
        </svg>
        Sign in with Microsoft
      </button>
      <p id="login-error" class="login-error hidden"></p>
      <p class="login-note">Microsoft employees only (@microsoft.com)</p>
    </div>
  </div>

  <div id="app" class="hidden">
    <!-- Top Navigation Bar (Harvest-style) -->
    <header class="top-nav">
      <div class="nav-inner">
        <nav class="main-tabs">
          <button class="nav-tab active" data-view="timer">Time</button>
          <button class="nav-tab" data-view="timesheet">Timesheet</button>
          <button class="nav-tab" data-view="reports">Reports</button>
          <button class="nav-tab" data-view="projects">Projects</button>
        </nav>
        <div class="nav-right">
          <button id="exportBtn" class="nav-link" title="Export CSV">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Export
          </button>
          <div id="userInfo" class="user-chip hidden"></div>
          <button id="signOutBtn" class="nav-link" onclick="signOut()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Sign Out
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="content-area">

      <!-- ===== Timer / Time View ===== -->
      <section id="view-timer" class="view active">
        <!-- Date Header -->
        <div class="date-header">
          <div class="date-nav-group">
            <button id="prevDay" class="arrow-btn">&lsaquo;</button>
            <button id="nextDay" class="arrow-btn">&rsaquo;</button>
            <h1 id="currentDateLabel" class="date-title"></h1>
          </div>
        </div>

        <!-- Week Summary Bar -->
        <div class="week-bar">
          <div class="new-entry-trigger" id="newEntryBtn">
            <div class="plus-icon">+</div>
            <span class="new-entry-label">New entry</span>
          </div>
          <div class="week-days" id="weekDaysBar">
            <!-- Mon–Sun day columns rendered by JS -->
          </div>
          <div class="week-total-col">
            <span class="wt-label">Week total</span>
            <strong id="weekTotalDisplay">0:00</strong>
          </div>
        </div>

        <!-- Timer Input Bar -->
        <div class="timer-input-bar" id="timerInputBar">
          <input type="text" id="taskDesc" class="timer-desc-input" placeholder="What are you working on?">
          <select id="projectSelect" class="timer-project-select">
            <option value="">&mdash; Project &mdash;</option>
          </select>
          <div class="timer-display" id="timerDisplay">0:00:00</div>
          <button id="timerToggle" class="timer-action-btn start">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            Start
          </button>
        </div>

        <!-- Entries List -->
        <div id="entriesList" class="entries-list"></div>

        <!-- Daily Total Footer -->
        <div class="daily-total-bar" id="dailyTotalBar">
          <span>Total:</span>
          <strong id="dailyTotal">0:00</strong>
        </div>
      </section>

      <!-- ===== Timesheet View ===== -->
      <section id="view-timesheet" class="view">
        <div class="section-header">
          <button id="prevWeek" class="arrow-btn">&lsaquo;</button>
          <button id="nextWeek" class="arrow-btn">&rsaquo;</button>
          <h2 id="weekLabel"></h2>
          <span class="weekly-total" id="weeklyTotal">0:00</span>
        </div>
        <div class="timesheet-grid" id="timesheetGrid"></div>
      </section>

      <!-- ===== Reports View ===== -->
      <section id="view-reports" class="view">
        <div class="section-header">
          <h2>Weekly Report</h2>
          <div class="report-controls">
            <button id="prevReportWeek" class="arrow-btn">&lsaquo;</button>
            <span id="reportWeekLabel"></span>
            <button id="nextReportWeek" class="arrow-btn">&rsaquo;</button>
          </div>
        </div>
        <div class="charts-container">
          <div class="chart-card">
            <h3>Hours by Day</h3>
            <canvas id="dailyChart"></canvas>
          </div>
          <div class="chart-card">
            <h3>Hours by Project</h3>
            <canvas id="projectChart"></canvas>
          </div>
        </div>
        <div class="report-summary" id="reportSummary"></div>
      </section>

      <!-- ===== Projects View ===== -->
      <section id="view-projects" class="view">
        <div class="section-header">
          <h2>Projects</h2>
          <button id="addProjectBtn" class="btn-primary">+ New Project</button>
        </div>
        <div id="projectForm" class="project-form hidden">
          <input type="text" id="projectName" placeholder="Project name" class="form-input">
          <div class="color-picker">
            <button class="color-dot" data-color="#fa5252" style="background:#fa5252"></button>
            <button class="color-dot" data-color="#e64980" style="background:#e64980"></button>
            <button class="color-dot" data-color="#be4bdb" style="background:#be4bdb"></button>
            <button class="color-dot" data-color="#7950f2" style="background:#7950f2"></button>
            <button class="color-dot" data-color="#4c6ef5" style="background:#4c6ef5"></button>
            <button class="color-dot" data-color="#228be6" style="background:#228be6"></button>
            <button class="color-dot" data-color="#15aabf" style="background:#15aabf"></button>
            <button class="color-dot" data-color="#12b886" style="background:#12b886"></button>
            <button class="color-dot" data-color="#40c057" style="background:#40c057"></button>
            <button class="color-dot" data-color="#fab005" style="background:#fab005"></button>
            <button class="color-dot" data-color="#fd7e14" style="background:#fd7e14"></button>
          </div>
          <div class="form-actions">
            <button id="saveProject" class="btn-primary">Save</button>
            <button id="cancelProject" class="btn-secondary">Cancel</button>
          </div>
        </div>
        <div id="projectsList" class="projects-list"></div>
      </section>
    </main>
  </div>

  <!-- Edit Entry Modal -->
  <div id="editModal" class="modal hidden">
    <div class="modal-content">
      <h3>Edit Time Entry</h3>
      <label>Description</label>
      <input type="text" id="editDesc" class="modal-input">
      <label>Project</label>
      <select id="editProject" class="modal-input"></select>
      <div class="time-row">
        <div>
          <label>Start</label>
          <input type="time" id="editStart" class="modal-input">
        </div>
        <div>
          <label>End</label>
          <input type="time" id="editEnd" class="modal-input">
        </div>
      </div>
      <div class="modal-actions">
        <button id="saveEdit" class="btn-primary">Save</button>
        <button id="deleteEntry" class="btn-danger">Delete</button>
        <button id="cancelEdit" class="btn-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
